<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Jason Blackert</title>
    <link rel="stylesheet" href="./build/css/style.css">
    <link rel="icon" href=./build/assets/space-invaders.ico>
    <style>
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { animation: blink 1s step-end infinite; }
        .title-bar { overflow: hidden; }
        .title-text { white-space: nowrap; display: inline-block; transition: transform 1.5s ease-in-out; }
        .title-bar:hover .title-text { transform: translateX(-2.5rem); }
        .title-bar .rounded-full { position: relative; z-index: 1; }
        /* Page loader */
        #page-loader { transition: opacity 0.3s ease; }
        #page-loader.fade-out { opacity: 0; pointer-events: none; }
        html:not(.dark) #page-loader { background-color: #f1f5f9; }
        html:not(.dark) #page-loader .text-indigo-400 { color: #4338ca; }
        html:not(.dark) #page-loader .text-gray-300 { color: #334155; }
        html:not(.dark) #page-loader .text-gray-400 { color: #64748b; }
        html:not(.dark) #page-loader .text-green-400 { color: #15803d; }
        /* Light mode */
        html:not(.dark) body { background-color: #f1f5f9; }
        html:not(.dark) header { background-color: #e0e7ff !important; border-color: #c7d2fe !important; }
        html:not(.dark) header a { color: #4338ca; }
        html:not(.dark) header button { color: #4338ca; }

        html:not(.dark) footer a { color: #64748b; }
        html:not(.dark) footer span { color: #64748b; }
        html:not(.dark) #mobile-menu { border-color: #c7d2fe; }
        html:not(.dark) .title-bar { background-color: #e0e7ff !important; }
        html:not(.dark) .title-text { color: #4338ca !important; }
        html:not(.dark) main article.bg-gray-900 { background-color: #ffffff !important; border-color: #c7d2fe !important; }
        html:not(.dark) #about-body { background-color: #ffffff !important; }
        html:not(.dark) #about-body .text-indigo-400 { color: #4338ca; }
        html:not(.dark) #about-body .text-green-400 { color: #15803d; }
        html:not(.dark) #about-body .text-gray-300 { color: #334155; }
        html:not(.dark) #about-body .text-white { color: #1e293b; }
        html:not(.dark) #about-body .text-yellow-400 { color: #b45309; }
        html:not(.dark) #about-body .text-indigo-300 { color: #4338ca; }
    </style>
    <script src="./build/assets/theme-init.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-gray-800 dark:text-white">

    <!-- Page loader -->
    <div id="page-loader" class="fixed inset-0 bg-gray-800 z-50 flex items-center justify-center p-8">
        <div class="font-mono text-sm w-full max-w-lg">
            <div id="loader-lines"></div>
            <span id="loader-cursor" class="text-green-400 cursor-blink">█</span>
        </div>
    </div>
    <script>
        (function () {
            var LINES = [
                { prompt: true },
                { text: 'loading assets...            done', cls: 'text-gray-400', delay: 140 },
                { text: 'opening about.txt...         done', cls: 'text-gray-400', delay: 160 },
                { text: 'ready.', cls: 'text-green-400', delay: 120 },
            ];
            var container = document.getElementById('loader-lines');
            var cursor    = document.getElementById('loader-cursor');
            var loader    = document.getElementById('page-loader');
            function printLine(item) {
                var el = document.createElement('div');
                if (item.prompt) {
                    el.innerHTML = '<span class="text-indigo-400">$ </span><span class="text-gray-300">cd about/</span>';
                } else {
                    el.className = item.cls;
                    el.textContent = item.text;
                }
                container.appendChild(el);
            }
            function run(idx) {
                if (idx >= LINES.length) {
                    setTimeout(function () {
                        cursor.remove();
                        loader.classList.add('fade-out');
                        setTimeout(function () { loader.remove(); }, 350);
                    }, 180);
                    return;
                }
                var item = LINES[idx];
                setTimeout(function () { printLine(item); run(idx + 1); }, item.delay || 0);
            }
            run(0);
        })();
    </script>

    <header class="bg-gray-900 text-white sticky top-0 z-10 border-b border-indigo-900">
        <section class="max-w-5xl mx-auto px-4 py-2 flex items-center gap-3">

                <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
            </span>
            <a href="./index.html" class="font-mono text-sm text-gray-400 hover:text-white transition-colors whitespace-nowrap">jason@portfolio:~/about</a>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="close-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </section>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden border-t border-indigo-900 font-mono text-sm">
            <nav class="max-w-5xl mx-auto px-4 py-3 flex flex-col gap-1">
                <a href="./about.html" class="px-2 py-2 text-indigo-400">about</a>
                <a href="./contact.html" class="px-2 py-2 text-gray-300 hover:text-indigo-400 transition-colors">contact</a>
                <div class="border-t border-indigo-900 mt-2 pt-3 px-2">
                    <button id="theme-toggle-mobile" aria-label="Toggle dark mode" class="text-gray-400 hover:text-indigo-400 transition-colors focus:outline-none"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
                </div>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 flex-1 w-full">

                    <a href="https://jasonblackert.substack.com" target="_blank" rel="noopener" class="hover:text-white transition-colors">Substack</a>
                </div>
            </div>
            <hr class="border-indigo-900 mb-4 mt-10">
            <span class="font-mono text-xs text-gray-500">© 2026 Jason Blackert</span>

    </footer>

    <script>
        (function () {
            var body = document.getElementById('about-body');
            var sleep = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };

            function print(text, cls) {
                var el = document.createElement('div');
                el.className = cls || 'text-gray-300';
                el.textContent = text;
                body.appendChild(el);
            }

            async function run() {
                await sleep(500);

                print('$ cat about.txt', 'text-green-400');
                await sleep(120);
                print('Jason Blackert', 'text-white');
                print('Senior Embedded Software Engineer', 'text-indigo-300');
                print('');

                await sleep(350);
                print('$ cat education.txt', 'text-green-400');
                await sleep(120);
                print('B.S. Computer Engineering — Texas State University');
                print('');

                await sleep(350);
                print('$ ls experience/', 'text-green-400');
                await sleep(120);
                print('Embedded SW @ Tactual Labs Co.  ·  IoT SW @ Yotta Energy Co.', 'text-indigo-300');
                print('');

                await sleep(350);
                print('$ ls skills/', 'text-green-400');
                await sleep(120);
                print('C/C++  Python  MQTT  Linux  Git  Docker  PyQt  ESP32', 'text-yellow-400');
                print('');

                await sleep(350);
                print('$ cat interests.txt', 'text-green-400');
                await sleep(120);
                print('Training for a marathon  ·  Embedded systems  ·  Home automation');
                print('');

                var idle = document.createElement('div');
                idle.innerHTML = '<span class="text-indigo-400">$ </span><span class="cursor-blink">█</span>';
                body.appendChild(idle);
            }

            run();
        })();
    </script>
    <script src="./build/assets/site.js"></script>
</body>
</html>
